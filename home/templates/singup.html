{% extends 'base.html' %}

{% block content %}

<h1>Singup</h1>

<form >
    {% csrf_token %}
    <p>
        <label>Username</label>
        <input type='text' name="username">
        </p>
        <p>
        <label>Password</label>
        <input type='password' name="password">
        </p>
        <p>
        <label>Email</label>
        <input type='email' name="email">
        </p>
        <button type="submit">Singup Here</button>
</form>

{% for message in messages %}
<p>{{message}}</p>
{% endfor %}
{% endblock %}
