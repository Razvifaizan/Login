{% extends 'base.html' %}

{% block content %}

<h1>Login</h1>

<form method="POST" >
    {% csrf_token %}
    <p>
        <label>Username</label>
        <input type='text' name="username">
        </p>
        <p>
        <label>Password</label>
        <input type='password' name="password">
        </p>

        <button type="submit">Login Here</button>
</form>

{% for message in messages %}
<p>{{message}}</p>
{% endfor %}

{% endblock %}
